name: Build & Semantic Release Multi-Arch Binaries

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_NO_DEPRECATED_NODE_WARNINGS: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - name: Arch Linux x86_64
            os: ubuntu-latest
            container: archlinux:base-devel
            setup_cmd: pacman -Syu --needed --noconfirm git sqlite ffmpeg curl tar xz pkgconf
            zig_cpu: silvermont
            artifact_name: sratim-arch-n3150
            binary_name: sratim-archlinux-x86_64-silvermont
          - name: Debian 11 (Bullseye) x86_64
            os: ubuntu-latest
            container: debian:11
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-debian11-x86_64
            binary_name: sratim-debian11-x86_64-baseline
          - name: Debian 12 (Bookworm) x86_64
            os: ubuntu-latest
            container: debian:12
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-debian12-x86_64
            binary_name: sratim-debian12-x86_64-baseline
          - name: Debian 13 (Trixie) x86_64
            os: ubuntu-latest
            container: debian:trixie
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-debian13-x86_64
            binary_name: sratim-debian13-x86_64-baseline
          - name: Ubuntu 22.04 LTS x86_64
            os: ubuntu-latest
            container: ubuntu:22.04
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-ubuntu22.04-x86_64
            binary_name: sratim-ubuntu22.04-x86_64-baseline
          - name: Ubuntu 24.04 LTS x86_64
            os: ubuntu-latest
            container: ubuntu:24.04
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-ubuntu24.04-x86_64
            binary_name: sratim-ubuntu24.04-x86_64-baseline
          - name: Ubuntu 26.04 LTS x86_64
            os: ubuntu-latest
            container: ubuntu:rolling
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-ubuntu26.04-x86_64
            binary_name: sratim-ubuntu26.04-x86_64-baseline
          - name: Ubuntu ARM64 (Ampere)
            os: ubuntu-24.04-arm
            container: ubuntu:24.04
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev curl xz-utils pkg-config
            zig_cpu: neoverse_n1
            artifact_name: sratim-ubuntu-aarch64
            binary_name: sratim-ubuntu-aarch64-neoverse_n1

    steps:
      - name: Install System Dependencies
        run: ${{ matrix.setup_cmd }}

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Cache Zig Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-${{ matrix.artifact_name }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: |
            zig-build-${{ matrix.artifact_name }}-

      - name: Calculate Version (Dry Run)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Build Binary (-Doptimize=ReleaseFast -Dcpu=${{ matrix.zig_cpu }})
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=${{ matrix.zig_cpu }} -Dversion=${{ steps.tag_version.outputs.new_tag }}

      - name: Rename Binary
        run: mv zig-out/bin/sratim zig-out/bin/${{ matrix.binary_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: zig-out/bin/${{ matrix.binary_name }}
          retention-days: 1 

  release:
    name: Generate Semantic Release
    needs: build
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch 

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          chmod +x ./artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: ./artifacts/*

  deploy:
    name: Deploy to padre.rus9n.com
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://elvis.rus9n.com
    
    steps:
      - name: Trigger Remote Installation
        uses: appleboy/ssh-action@master
        with:
          host: padre.rus9n.com
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            curl -sL https://raw.githubusercontent.com/borisgk/sratim/main/scripts/install.sh | sudo bash

  deploy-demo:
    name: Deploy to meet.rus9n.com (Demo)
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://il1.rus9n.com
    
    steps:
      - name: Trigger Remote Installation
        uses: appleboy/ssh-action@master
        with:
          host: meet.rus9n.com
          username: ${{ secrets.DEMO_USERNAME }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            curl -sL https://raw.githubusercontent.com/borisgk/sratim/main/scripts/install.sh | sudo bash

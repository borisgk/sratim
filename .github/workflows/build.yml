name: Build & Semantic Release Multi-Arch Binaries

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_NO_DEPRECATED_NODE_WARNINGS: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64 (Baseline)
            os: ubuntu-latest
            container: ubuntu:22.04
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev curl xz-utils pkg-config
            zig_cpu: baseline
            artifact_name: sratim-linux-x86_64-baseline
            binary_name: sratim-linux-x86_64-baseline
          - name: Arch Linux x86_64 (Silvermont)
            os: ubuntu-latest
            container: archlinux:base-devel
            setup_cmd: pacman -Syu --needed --noconfirm git sqlite curl tar xz pkgconf
            zig_cpu: silvermont
            artifact_name: sratim-arch-n3150
            binary_name: sratim-archlinux-x86_64-silvermont
          - name: Ubuntu 26.04 LTS ARM64 (Ampere)
            os: ubuntu-24.04-arm
            container: ubuntu:26.04
            setup_cmd: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git libsqlite3-dev curl xz-utils pkg-config
            zig_cpu: neoverse_n1
            artifact_name: sratim-ubuntu-aarch64
            binary_name: sratim-ubuntu-aarch64-neoverse_n1

    steps:
      - name: Install System Dependencies
        run: ${{ matrix.setup_cmd }}

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Cache Zig Build Artifacts
        uses: actions/cache@v6
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-build-${{ matrix.artifact_name }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: |
            zig-build-${{ matrix.artifact_name }}-

      - name: Calculate Version (Dry Run)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Build Binary (-Doptimize=ReleaseFast -Dcpu=${{ matrix.zig_cpu }})
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=${{ matrix.zig_cpu }} -Dversion=${{ steps.tag_version.outputs.new_tag }}

      - name: Rename Binary
        run: mv zig-out/bin/sratim zig-out/bin/${{ matrix.binary_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: zig-out/bin/${{ matrix.binary_name }}
          retention-days: 1 

  release:
    name: Generate Semantic Release
    needs: build
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch 

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Prepare Release Assets
        run: |
          chmod +x ./artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: ./artifacts/*

  deploy:
    name: Deploy to padre.rus9n.com
    if: false # Temporarily disabled: production host (padre.rus9n.com) is down. Re-enable by removing or toggling this line.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://elvis.rus9n.com
    
    steps:
      - name: Trigger Remote Installation
        uses: appleboy/ssh-action@v1
        with:
          host: padre.rus9n.com
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            curl -sL https://raw.githubusercontent.com/borisgk/sratim/main/scripts/install.sh | sudo bash

  deploy-demo:
    name: Deploy to meet.rus9n.com (Demo)
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://il1.rus9n.com
    
    steps:
      - name: Trigger Remote Installation
        uses: appleboy/ssh-action@v1
        with:
          host: meet.rus9n.com
          username: ${{ secrets.DEMO_USERNAME }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            curl -sL https://raw.githubusercontent.com/borisgk/sratim/main/scripts/install.sh | sudo bash
